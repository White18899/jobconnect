name = "jobconnect-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:3000"
UPI_ID = "jobconnect@icici"
APP_NAME = "JobWay"
JWT_SECRET = "jobconnect_prod_secret_f9a8b7c6d5e4_2026_super_secure_key"
ADMIN_PASSWORD = "JobConnect@Admin2026"

# SMTP Configuration (Brevo SMTP Relay)
SMTP_HOST = "smtp-relay.brevo.com"
SMTP_PORT = "587"
SMTP_USER = "b2ab18001@smtp-brevo.com"
SMTP_FROM = "JobWay <noreply@job-way.in>"
SMTP_SECURE = "false"
GOOGLE_CLIENT_ID = "327984223622-q76h9hqckba58ga8ampesr7rid1dl3m9.apps.googleusercontent.com"

# Meta WhatsApp Business Cloud API
WHATSAPP_PHONE_NUMBER_ID = "1378441025360192"
WHATSAPP_CLOUD_API_TOKEN = ""
WHATSAPP_TEMPLATE_NAME = "hello_world"



# Custom Domain (Cloudflare Workers)
routes = [
  { pattern = "api.job-way.in", custom_domain = true }
]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "jobconnect-db"
database_id = "eba3b1ff-4cbb-4198-9775-8079c142bb5c"
migrations_dir = "src/db/migrations"

# Cloudflare KV Namespace for OTP & Rate Limiting
[[kv_namespaces]]
binding = "KV"
id = "043b4e5284154cd18a07a9deabef7843"

# Cloudflare R2 Bucket for Private File Storage
[[r2_buckets]]
binding = "FILES"
bucket_name = "jobconnect-files"
